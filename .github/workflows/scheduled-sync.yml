name: scheduled-sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/globalinvesting-scripts
          token: ${{ secrets.SCRIPTS_PAT }}
          path: private-scripts

      - name: Setup CLI
        run: pip install --quiet oci-cli

      - name: Configure
        env:
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s' "$OCI_KEY" > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/key.pem"
          } > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"

      - name: Run
        env:
          OCI_TARGET_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_TARGET_SUBNET: ${{ secrets.OCI_SUBNET_ID }}
          OCI_TARGET_IMAGE: ${{ secrets.OCI_IMAGE_ID }}
          OCI_TARGET_SSH_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_TARGET_NAME: ${{ secrets.OCI_INSTANCE_NAME }}
          OCI_TARGET_AD1: ${{ secrets.OCI_AD_1 }}
          OCI_TARGET_AD2: ${{ secrets.OCI_AD_2 }}
          OCI_TARGET_AD3: ${{ secrets.OCI_AD_3 }}
        run: bash private-scripts/create_instance_retry.sh
