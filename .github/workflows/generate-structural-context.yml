name: Generate Structural Context

on:
  repository_dispatch:
    types: [trigger-structural-context]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

concurrency:
  group: generate-structural-context
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout THIS public site repo
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout private engine repo (scripts)
        uses: actions/checkout@v6
        with:
          repository: GlobalInvesting/globalinvesting-engine
          token: ${{ secrets.PAT_TOKEN }}
          path: engine

      - name: Idempotency guard -- skip if a sibling trigger already ran today (UTC)
        id: guard
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "site/ai-analysis/currency-catalysts.json" ]; then
            GENERATED_AT=$(python3 -c "import json; d=json.load(open('site/ai-analysis/currency-catalysts.json')); print(d.get('generated_at',''))" 2>/dev/null || echo "")
            if [ -n "$GENERATED_AT" ]; then
              SAME_DAY=$(python3 -c "
          from datetime import datetime, timezone
          ts = '$GENERATED_AT'.replace('Z', '+00:00')
          gen_date = datetime.fromisoformat(ts).astimezone(timezone.utc).date()
          today = datetime.now(timezone.utc).date()
          print('true' if gen_date == today else 'false')
          " 2>/dev/null || echo "false")
              if [ "$SAME_DAY" = "true" ]; then
                echo "site/ai-analysis/currency-catalysts.json was already generated today (UTC, ${GENERATED_AT}) — a sibling trigger already completed this cycle. Skipping the rest of this run."
                SKIP=true
              fi
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests --break-system-packages

      - name: Create output directories
        if: steps.guard.outputs.skip != 'true'
        run: mkdir -p site/ai-analysis

      - name: Generate currency drivers and catalysts
        if: steps.guard.outputs.skip != 'true'
        working-directory: site
        env:
          AI_FALLBACK_KEY:   ${{ secrets.AI_FALLBACK_KEY }}
          AI_FALLBACK_KEY_2: ${{ secrets.AI_FALLBACK_KEY_2 }}
          AI_FALLBACK_KEY_3: ${{ secrets.AI_FALLBACK_KEY_3 }}
          AI_FALLBACK_KEY_4: ${{ secrets.AI_FALLBACK_KEY_4 }}
          AI_FALLBACK_KEY_5: ${{ secrets.AI_FALLBACK_KEY_5 }}
          AI_FALLBACK_KEY_6: ${{ secrets.AI_FALLBACK_KEY_6 }}
          AI_PRIMARY_KEY:   ${{ secrets.AI_PRIMARY_KEY }}
          AI_PRIMARY_KEY_2: ${{ secrets.AI_PRIMARY_KEY_2 }}
          AI_PRIMARY_KEY_3: ${{ secrets.AI_PRIMARY_KEY_3 }}
          AI_PRIMARY_KEY_4: ${{ secrets.AI_PRIMARY_KEY_4 }}
          AI_PRIMARY_KEY_5: ${{ secrets.AI_PRIMARY_KEY_5 }}
          AI_PRIMARY_KEY_6: ${{ secrets.AI_PRIMARY_KEY_6 }}
          AI_PRIMARY_KEY_7: ${{ secrets.AI_PRIMARY_KEY_7 }}
          WEB_SEARCH_KEY: ${{ secrets.WEB_SEARCH_KEY }}
        run: |
          DAY_OF_WEEK=$(date -u +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — forcing regeneration (--force)"
            python ../engine/scripts/generate_narrative_signals.py --mode structural --force
          elif [ "$DAY_OF_WEEK" = "1" ]; then
            echo "Monday scheduled run — forcing weekly regeneration (--force)"
            python ../engine/scripts/generate_narrative_signals.py --mode structural --force
          else
            python ../engine/scripts/generate_narrative_signals.py --mode structural
          fi

      - name: Display output summary
        if: always()
        working-directory: site
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "   STRUCTURAL CONTEXT SUMMARY"
          echo "════════════════════════════════════════"
                    echo "  session-context.json: generated by generate-ai-narrative.yml (intraday workflow)"
          if [ -f "ai-analysis/currency-drivers.json" ]; then
            python3 -c "
          import json
          with open('ai-analysis/currency-drivers.json') as f:
              d = json.load(f)
          drivers = d.get('drivers', {})
          print(f'  Currency drivers: {len(drivers)} currencies')
          for ccy, notes in drivers.items():
              n = notes if isinstance(notes, str) else str(notes)
              print(f'    {ccy}: {n[:80]}')
          "
          fi
          if [ -f "ai-analysis/currency-catalysts.json" ]; then
            python3 -c "
          import json
          with open('ai-analysis/currency-catalysts.json') as f:
              d = json.load(f)
          ccys = d.get('currencies', {})
          print(f'  Currency catalysts: {len(ccys)} currencies')
          for ccy, entry in ccys.items():
              cat = (entry or {}).get('catalyst', '')
              nsrc = len((entry or {}).get('sources', []))
              print(f'    {ccy}: ({nsrc} sources) {cat[:80]}')
          "
          fi

      - name: Commit and push
        if: steps.guard.outputs.skip != 'true'
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/structural_fresh
          cp ai-analysis/currency-drivers.json /tmp/structural_fresh/
          [ -f ai-analysis/currency-catalysts.json ] && cp ai-analysis/currency-catalysts.json /tmp/structural_fresh/
          [ -f ai-analysis/call-budget-state.json ] && cp ai-analysis/call-budget-state.json /tmp/structural_fresh/
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/structural_fresh/currency-drivers.json \
               ai-analysis/
            git add ai-analysis/currency-drivers.json
            if [ -f /tmp/structural_fresh/currency-catalysts.json ]; then
              cp /tmp/structural_fresh/currency-catalysts.json ai-analysis/
              git add ai-analysis/currency-catalysts.json
            fi
            if [ -f /tmp/structural_fresh/call-budget-state.json ]; then
              cp /tmp/structural_fresh/call-budget-state.json ai-analysis/
              git add ai-analysis/call-budget-state.json
            fi
            if git diff --quiet && git diff --staged --quiet; then
              echo "No changes vs remote HEAD — skipping commit."
              exit 0
            fi
            git commit -m "ai: structural context [${TIMESTAMP}]"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "⚠️  All push attempts exhausted — structural context will publish on next scheduled run."
          exit 0
