name: Update Economic Calendar (calendar.json)
#
# This workflow builds calendar-data/calendar.json (the source for the
# Economic Matrix and Economic Surprises Index) from economic-events.json.
# It runs in this repo so it uses free public-repo Actions minutes; the
# private-scripts checkout below only pulls in the fetch script itself.
#
# v8.494.0 FIX (2026-09-15): this workflow used to live in the private
# globalinvesting-scripts repo and was moved here specifically to stop
# consuming that repo's budgeted Actions minutes -- confirmed via GitHub's
# own Actions usage report showing this workflow's runs (207 in the
# current billing cycle, far above its own 4x/day schedule) as the
# largest single consumer of the private repo's monthly allowance. The
# repository_dispatch[calendar-actual-changed] listener below is fed by a
# step in update-economic-calendar-primary.yml, in this same repo -- no
# cross-repo PAT is needed on either side of that dispatch. See that
# workflow's own dispatch step (same session's fix) and CHANGELOG.md
# v8.494.0.
on:
  workflow_call:
    secrets:
      SCRIPTS_PAT:
        required: true
  repository_dispatch:
    types:
    - calendar-actual-changed
  schedule:
  - cron: '30 5 * * *'
  - cron: '30 9 * * *'
  - cron: '30 13 * * *'
  - cron: '30 20 * * *'
  workflow_dispatch: null
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-economic-calendar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-economic-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Checkout private scripts
        uses: actions/checkout@v6
        with:
          repository: GlobalInvesting/globalinvesting-scripts
          token: ${{ secrets.SCRIPTS_PAT }}
          path: private-scripts

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --break-system-packages

      - name: Create calendar-data directory
        run: mkdir -p calendar-data

      - name: Build calendar.json from economic-events.json
        run: python private-scripts/fetch_economic_calendar.py

      - name: Display summary
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "    ECONOMIC CALENDAR FETCH SUMMARY"
          echo "========================================"
          if [ -f "calendar-data/calendar.json" ]; then
            python3 -c "
          import json
          from datetime import datetime, timezone, timedelta
          with open('calendar-data/calendar.json') as f:
              cal = json.load(f)
          events = cal.get('events', [])
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          cutoff_90 = (datetime.now(timezone.utc) - timedelta(days=90)).strftime('%Y-%m-%d')
          released_90  = [e for e in events if e.get('actual') and e.get('dateISO','') >= cutoff_90]
          beat_miss_90 = [e for e in released_90 if e.get('forecast')]
          high_today   = [e for e in events if e.get('impact') == 'high' and e.get('dateISO') == today]
          print(f'  Source: {cal.get(\"source\",\"unknown\")}')
          print(f'  Total events: {len(events)}')
          print(f'  Released (90d): {len(released_90)} | with beat/miss data: {len(beat_miss_90)}')
          print(f'  High-impact today ({today}): {len(high_today)}')
          for e in high_today:
              print(f'    {e[\"timeUTC\"]} [{e[\"currency\"]}] {e[\"event\"][:45]} | actual={e.get(\"actual\") or \"pending\"} forecast={e.get(\"forecast\") or \"—\"}')"
          else
            echo "  calendar.json not found"
          fi

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          for i in 1 2 3 4 5; do
            echo "--- Push attempt $i ---"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p calendar-data
            # v3.15 FIX (2026-09-15): same incident class as
            # fetch_economic_calendar_primary.py v1.7 / fetch_te_calendar.py
            # v2.2 — calendar.json has other independent writers in this
            # same window (update-calendar-completeness.yml,
            # calendar-watcher.js's own direct-commit fallback), so blindly
            # cp-ing this run's once-computed output over the just-reset
            # remote state discards whatever either of them committed
            # between this run's checkout and this retry. Unlike those two
            # fixes, no --remerge mode is needed here: this script's own
            # main() already reads calendar-data/calendar.json fresh from
            # disk on every call (load_previous_calendar(), Step 3) and
            # merges it against economic-events.json (this script's other
            # input, untouched within this job — never modified by any
            # writer this workflow itself races against) — so simply
            # re-running the script against the just-reset file re-derives
            # correct output on every retry, at zero extra network cost.
            # See fetch_economic_calendar.py's module header and
            # CHANGELOG.md.
            python private-scripts/fetch_economic_calendar.py
            BEAT_MISS=$(python3 -c "
          import json
          from datetime import datetime, timezone, timedelta
          c = json.load(open('calendar-data/calendar.json'))
          cutoff = (datetime.now(timezone.utc) - timedelta(days=90)).strftime('%Y-%m-%d')
          n = sum(1 for e in c['events'] if e.get('actual') and e.get('forecast') and e.get('dateISO','') >= cutoff)
          print(f'{n} beat/miss events (90d)')
          " 2>/dev/null || echo "updated")
            git add calendar-data/calendar.json
            if git diff --quiet && git diff --staged --quiet; then
              echo "No changes vs remote HEAD — skipping commit (race condition resolved)."
              exit 0
            fi
            git commit -m "Economic calendar ${TIMESTAMP} — ${BEAT_MISS}"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          exit 0
