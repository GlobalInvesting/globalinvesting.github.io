name: Deploy GitHub Pages


on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: "pages-build"
      cancel-in-progress: true
    steps:
      - name: Clear stuck queued runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          THRESHOLD_MIN=10
          gh run list --repo "${{ github.repository }}" \
            --workflow=deploy-pages.yml --status=queued \
            --json databaseId,createdAt --limit 20 > /tmp/queued_runs.json
          python3 -c "
          import json, sys, subprocess
          from datetime import datetime, timezone

          THRESHOLD_MIN = ${THRESHOLD_MIN}
          with open('/tmp/queued_runs.json') as f:
              runs = json.load(f)
          now = datetime.now(timezone.utc)
          cleared = 0
          for r in runs:
              created = datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00'))
              age_min = (now - created).total_seconds() / 60
              if age_min > THRESHOLD_MIN:
                  print(f\"Cancelling stuck queued run {r['databaseId']} (queued {age_min:.0f}min ago)\")
                  subprocess.run(['gh', 'run', 'cancel', str(r['databaseId']), '--repo', '${{ github.repository }}'], check=False)
                  cleared += 1
          if cleared == 0:
              print('No stuck queued runs found — nothing to clear.')
          else:
              print(f'Cleared {cleared} stuck queued run(s).')
          "

      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version tag from CACHE_VERSION
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(grep -oE "CACHE_VERSION = '[^']+'" sw.js | sed -E "s/CACHE_VERSION = '(.*)'/\1/")
          VERSION="${RAW#gi-}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CACHE_VERSION in sw.js did not match the expected 'gi-vX.Y.Z' format (got '$RAW') — refusing to deploy with an unparsed version tag."
            exit 1
          fi
          COUNT=$(grep -l '{{CACHE_VERSION}}' *.html | wc -l)
          echo "Substituting {{CACHE_VERSION}} -> $VERSION in $COUNT HTML page(s)"
          sed -i "s/{{CACHE_VERSION}}/${VERSION}/g" *.html
          if grep -rl '{{CACHE_VERSION}}' *.html; then
            echo "::error::Placeholder survived substitution in the file(s) listed above."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
