name: Update TE Calendar (primary)

# Weekly full-calendar refresh from Trading Economics (fetch_te_calendar.py
# v2.0+, PRIMARY mode). ForexFactory/Myfxbook (update-ff-calendar.yml) stays
# on its existing tight schedule and now acts as the fallback layer for
# faster actuals turnaround between TE's weekly passes; this workflow's job
# is calendar COMPLETENESS (new events, real impact tags) rather than
# minute-level actuals speed. Merge-only writer discipline (never overwrites
# an existing non-null actual/previous/forecast/impact) means running this
# alongside the existing ff-calendar pipeline is safe by construction — see
# fetch_te_calendar.py's merge_full_events_into_calendar().

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday, 03:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-te-calendar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-te-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v6

      - name: Checkout private scripts
        uses: actions/checkout@v6
        with:
          repository: GlobalInvesting/globalinvesting-scripts
          token: ${{ secrets.SCRIPTS_PAT }}
          path: private-scripts

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml --break-system-packages

      - name: Fetch full calendar from Trading Economics (fetch_te_calendar.py v2.0, primary mode)
        run: python3 private-scripts/fetch_te_calendar.py

      - name: Display summary
        run: |
          echo ""
          echo "========================================"
          echo "    TE CALENDAR FETCH SUMMARY"
          echo "========================================"
          python3 -c "
          import json
          from datetime import datetime, timezone
          with open('calendar-data/calendar.json') as f:
              cal = json.load(f)
          events = cal.get('events', [])
          te_events = [e for e in events if e.get('source') == 'trading-economics']
          print(f'  Total events in calendar.json: {len(events)}')
          print(f'  Trading-Economics-sourced events: {len(te_events)}')
          by_impact = {}
          for e in te_events:
              by_impact[e.get('impact')] = by_impact.get(e.get('impact'), 0) + 1
          print(f'  TE events by impact: {by_impact}')
          "

      - name: Commit and push (with retry on race)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- calendar-data/calendar.json && git diff --staged --quiet -- calendar-data/calendar.json; then
            echo "No changes to calendar-data/calendar.json — skipping commit."
            exit 0
          fi

          cp calendar-data/calendar.json /tmp/calendar_fresh.json
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/calendar_fresh.json calendar-data/calendar.json
            git add calendar-data/calendar.json
            if git diff --quiet && git diff --staged --quiet; then
              echo "No changes vs remote HEAD — skipping commit (race condition resolved)."
              exit 0
            fi
            git commit -m "TE calendar weekly refresh ${TIMESTAMP}"
            if git push origin main; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "All push attempts exhausted — data refreshes on next scheduled run."
          exit 0

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
