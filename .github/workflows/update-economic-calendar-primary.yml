name: Update Economic Calendar (Primary)


on:
  repository_dispatch:
    types: [calendar-data-changed]
  schedule:
    - cron: '*/5 * * * *'
    - cron: '30 2 * * *'
    - cron: '0 3 * * *'
    - cron: '30 3 * * *'
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 10 * * *'
    - cron: '30 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 11 * * *'
    - cron: '30 15 * * *'
    - cron: '0 16 * * *'
    - cron: '30 16 * * *'
    - cron: '0 17 * * *'
    - cron: '30 17 * * *'
    - cron: '0 18 * * *'
    - cron: '30 18 * * *'
    - cron: '0 19 * * *'
    - cron: '30 19 * * *'
    - cron: '0 20 * * *'
    - cron: '30 20 * * *'
    - cron: '0 21 * * *'
    - cron: '30 21 * * *'
    - cron: '0 22 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-economic-calendar-primary
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update-economic-calendar-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v6

      - name: Checkout private scripts
        uses: actions/checkout@v6
        with:
          repository: GlobalInvesting/globalinvesting-scripts
          token: ${{ secrets.SCRIPTS_PAT }}
          path: private-scripts


      - name: Time-window gate (release windows only for */5 runs)
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "repository_dispatch" ]; then
            DESC="${{ github.event.client_payload.description }}"
            SRC="${{ github.event.client_payload.source }}"
            echo "Triggered by repository_dispatch (${SRC}): ${DESC}"
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Triggered by workflow_dispatch (manual run) — proceeding unconditionally."
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          echo "Current UTC time: ${HOUR}:${MIN} (cron trigger)"

          OFFPEAK_SLOTS="02:30 03:00 03:30 04:00 04:30 05:00 10:00 10:30 11:00 11:30 15:30 16:00 16:30 17:00 17:30 18:00 18:30 19:00 19:30 20:00 20:30 21:00 21:30 22:00 22:30"
          CURRENT="${HOUR}:${MIN}"
          for slot in $OFFPEAK_SLOTS; do
            if [ "$CURRENT" = "$slot" ]; then
              echo "Off-peak colchón cron slot (${CURRENT}) — proceeding unconditionally."
              echo "run=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          HOUR_INT=$(( 10#$HOUR ))
          if [ $HOUR_INT -ge 22 ] || [ $HOUR_INT -lt 2 ] || \
             ( [ $HOUR_INT -eq 2 ] && [ $(( 10#$MIN )) -lt 30 ] ); then
            echo "In Asia/NZ release window (22:00–02:30 UTC) — proceeding."
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ( [ $HOUR_INT -eq 5 ] && [ $(( 10#$MIN )) -ge 30 ] ) || \
             ( [ $HOUR_INT -ge 6 ] && [ $HOUR_INT -lt 10 ] ); then
            echo "In EU/UK release window (05:30–10:00 UTC) — proceeding."
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ $HOUR_INT -ge 12 ] && \
             ( [ $HOUR_INT -lt 15 ] || ( [ $HOUR_INT -eq 15 ] && [ $(( 10#$MIN )) -le 30 ] ) ); then
            echo "In US release window (12:00–15:30 UTC) — proceeding."
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Off-peak hour — skipping fetch (not in any release window)."
          echo "run=false" >> $GITHUB_OUTPUT

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch economic calendar (primary source, single source — actuals + forward)
        if: steps.gate.outputs.run == 'true'
        run: python3 private-scripts/fetch_economic_calendar_primary.py

      - name: Display summary
        if: steps.gate.outputs.run == 'true'
        run: |
          echo ""
          echo "========================================"
          echo "    ECONOMIC CALENDAR FETCH SUMMARY"
          echo "========================================"
          CHANGED=$(cat /tmp/cal_changed 2>/dev/null || echo "0")
          echo "  Changed flag: ${CHANGED}"
          if [ -f "calendar-data/economic-events.json" ]; then
            python3 -c "
          import json
          from datetime import datetime, timezone
          with open('calendar-data/economic-events.json') as f:
              cal = json.load(f)
          events = cal.get('events', [])
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          released_all = [e for e in events if e.get('released')]
          today_evs = [e for e in events if e['dateISO'] == today]
          released_today = [e for e in today_evs if e.get('released')]
          high_today = [e for e in today_evs if e['impact'] == 'high']
          print(f'  Source: {cal.get(\"source\",\"?\")}')
          print(f'  Total events: {len(events)} | with actuals: {len(released_all)}')
          print(f'  Today ({today}): {len(today_evs)} events | {len(released_today)} released')
          forward_evs = [e for e in events if e['dateISO'] > today]
          print(f'  Forward-looking (dateISO > today): {len(forward_evs)} events')
          for e in high_today:
              status = e.get('actual') or 'pending'
              print(f'    {e[\"timeUTC\"]} [{e[\"currency\"]}] {e[\"title\"]} | actual={status} est={e.get(\"forecast\",\"—\")}')
          "
          fi

      - name: Commit and push (only if actuals/forecasts changed)
        id: push
        if: steps.gate.outputs.run == 'true'
        run: |
          CHANGED=$(cat /tmp/cal_changed 2>/dev/null || echo "0")
          if [ "${CHANGED}" != "1" ]; then
            echo "No new actuals or forecasts — skipping commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp calendar-data/economic-events.json /tmp/ff_calendar_fresh.json
          SOURCE=$(python3 -c "import json; print(json.load(open('/tmp/ff_calendar_fresh.json')).get('source','?'))" 2>/dev/null || echo "?")
          RELEASED=$(python3 -c "import json; c=json.load(open('/tmp/ff_calendar_fresh.json')); print(sum(1 for e in c['events'] if e.get('released')))" 2>/dev/null || echo "?")
          HIGH=$(python3 -c "import json; c=json.load(open('/tmp/ff_calendar_fresh.json')); print(sum(1 for e in c['events'] if e['impact']=='high'))" 2>/dev/null || echo "?")
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            git fetch origin main
            git reset --hard origin/main
            # v1.7 fix: re-merge against the state we just fetched, instead of
            # blindly overwriting it with the pre-computed fresh file. Between
            # this run's own checkout and this retry, calendar-watcher.js (or
            # any other writer) may have committed a stale-actuals recovery
            # straight to origin/main -- a blind cp here would silently
            # discard it. --remerge re-runs _merge_preserve_actual() against
            # the just-reset file so a mid-run recovery survives the retry.
            # See fetch_economic_calendar_primary.py v1.7 and CHANGELOG.md.
            python3 private-scripts/fetch_economic_calendar_primary.py --remerge \
              /tmp/ff_calendar_fresh.json calendar-data/economic-events.json calendar-data/economic-events.json
            git add calendar-data/economic-events.json
            if git diff --quiet && git diff --staged --quiet; then
              echo "No changes vs remote HEAD — skipping commit (race condition resolved)."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Calendar ${TIMESTAMP} [${SOURCE}] — ${HIGH} high-impact, ${RELEASED} with actuals"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "⚠️  All push attempts exhausted — data refreshes on next scheduled run."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trigger Pages deploy
        if: steps.gate.outputs.run == 'true' && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Dispatch calendar-actual-changed if any new actual detected
        if: steps.gate.outputs.run == 'true'
        env:
          SCRIPTS_PAT: ${{ secrets.SCRIPTS_PAT }}
        run: |
          CHANGED=$(cat /tmp/cal_changed 2>/dev/null || echo "0")
          if [ "${CHANGED}" != "1" ]; then
            echo "No calendar changes — skipping calendar-actual-changed dispatch."
            exit 0
          fi

          printf '%s\n' \
            'import json' \
            'from datetime import datetime,timezone,timedelta' \
            'cal=json.load(open("calendar-data/economic-events.json"))' \
            'events=cal.get("events",[])' \
            'today=datetime.now(timezone.utc).date()' \
            'window=set((today-timedelta(days=d)).strftime("%Y-%m-%d") for d in range(2))' \
            'hits=[ev["currency"]+":"+(ev.get("title") or ev.get("event") or "?") for ev in events if ev.get("released") and ev.get("dateISO") in window and (ev.get("actual") or "").strip()]' \
            'print(",".join(hits[:5]) if hits else "")' \
            > /tmp/check_new_actual.py
          NEW_ACTUAL=$(python3 /tmp/check_new_actual.py 2>/dev/null || echo "")

          if [ -z "${NEW_ACTUAL}" ]; then
            echo "No fresh actuals in the last 2 days — skipping dispatch."
            exit 0
          fi

          echo "Fresh actual(s) detected: ${NEW_ACTUAL}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # v8.494.0 FIX (2026-09-15): update-economic-calendar.yml (the
          # listener for this dispatch) moved to this same repo
          # (GlobalInvesting/globalinvesting.github.io) so it runs on free
          # public-repo Actions minutes instead of the private repo's
          # budgeted minutes. This dispatch step was left pointing at the
          # OLD location (globalinvesting-scripts), which no longer has
          # that workflow file at all -- GitHub's dispatches endpoint
          # still returns 204 for a POST naming a real repo even when no
          # workflow there listens for the event_type, so this was failing
          # silently: the fast (near-instant) refresh path degraded to
          # calendar.json's own 4x/day schedule fallback with no error
          # anywhere in the logs. Fixed by pointing the dispatch at this
          # repo instead -- repository_dispatch always needs an explicit
          # POST to the target repo's own /dispatches endpoint, even when
          # the sender and listener live in the same repo; GitHub does not
          # auto-chain same-repo workflows on this event type.
          echo "Firing repository_dispatch[calendar-actual-changed] -> GlobalInvesting/globalinvesting.github.io (update-economic-calendar.yml)"
          HTTP_CODE=$(curl -s -o /tmp/dispatch3.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SCRIPTS_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/GlobalInvesting/globalinvesting.github.io/dispatches" \
            -d "{\"event_type\":\"calendar-actual-changed\",\"client_payload\":{\"sample\":\"${NEW_ACTUAL}\",\"source\":\"ff-calendar\",\"date\":\"${NOW}\"}}")
          if [ "${HTTP_CODE}" = "204" ]; then
            echo "Dispatch accepted (204) -- update-economic-calendar.yml will start shortly."
          else
            echo "WARNING: dispatch to globalinvesting.github.io returned HTTP ${HTTP_CODE} -- check SCRIPTS_PAT scope/expiry."
            cat /tmp/dispatch3.json 2>/dev/null || true
          fi

      - name: Dispatch cb-rate-decision if interest rate actual detected
        if: steps.gate.outputs.run == 'true'
        env:
          SCRIPTS_PAT: ${{ secrets.SCRIPTS_PAT }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          CHANGED=$(cat /tmp/cal_changed 2>/dev/null || echo "0")
          if [ "${CHANGED}" != "1" ]; then
            echo "No calendar changes — skipping rate-decision dispatch check."
            exit 0
          fi

          # v8.521.0 FIX: this step's gate was "did economic-events.json
          # change at all this run" + "is there a released, high-impact
          # rate-decision actual within the last 3 days" -- with no check
          # for whether THIS specific decision had already been dispatched.
          # Any unrelated field changing elsewhere in the file (a forecast
          # update on a different currency, for example) re-set CHANGED=1
          # on a normal 5-minute cron tick, and the RATE_DEC scan then
          # re-matched the SAME already-dispatched decision again, every
          # time, for up to 3 days after every G10 rate decision -- firing
          # repository_dispatch[cb-rate-decision] into both private repos
          # (globalinvesting-scripts' update-rates.yml AND
          # globalinvesting-engine's workflow_meetings.yml) roughly every
          # 5 minutes for days, confirmed live via both repos' Actions run
          # history. Fixed with a small persisted dedup log
          # (calendar-data/cb-rate-dispatch-log.json, keyed on
          # currency|dateISO|actual) committed alongside the calendar data:
          # a decision is only dispatched once per distinct
          # currency+date+actual-value combination; a later revision to
          # the same event's actual (rare, but has happened for this
          # project) still dispatches once, since the key changes with it.
          printf '%s\n' \
            'import json,os' \
            'from datetime import datetime,timezone,timedelta' \
            'cal=json.load(open("calendar-data/economic-events.json"))' \
            'events=cal.get("events",[])' \
            'today=datetime.now(timezone.utc).date()' \
            'window=set((today-timedelta(days=d)).strftime("%Y-%m-%d") for d in range(3))' \
            'kw=["interest rate decision","interest rate","rate decision","monetary policy decision","policy rate","cash rate"]' \
            'candidates=[ev for ev in events if ev.get("released") and ev.get("dateISO") in window and ev.get("impact")=="high" and ev.get("actual","").strip() and any(k in (ev.get("title") or "").lower() for k in kw)]' \
            'log_path="calendar-data/cb-rate-dispatch-log.json"' \
            'log=json.load(open(log_path)) if os.path.exists(log_path) else {}' \
            'def key(ev): return ev["currency"]+"|"+ev["dateISO"]+"|"+ev["actual"].strip()' \
            'new=[ev for ev in candidates if key(ev) not in log]' \
            'hits=[ev["currency"]+":"+ev["actual"].strip() for ev in new]' \
            'open("/tmp/new_rate_dec_keys.json","w").write(json.dumps([key(ev) for ev in new]))' \
            'print(",".join(hits) if hits else "")' \
            > /tmp/check_rate_dec.py
          RATE_DEC=$(python3 /tmp/check_rate_dec.py 2>/dev/null || echo "")

          if [ -z "${RATE_DEC}" ]; then
            echo "No NEW Interest Rate Decision actuals since the last dispatch — skipping."
            exit 0
          fi

          echo "New Interest Rate Decision actual(s) detected: ${RATE_DEC}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Firing repository_dispatch[cb-rate-decision] -> GlobalInvesting/globalinvesting-scripts (update-rates.yml)"
          HTTP_CODE_1=$(curl -s -o /tmp/dispatch1.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SCRIPTS_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/GlobalInvesting/globalinvesting-scripts/dispatches" \
            -d "{\"event_type\":\"cb-rate-decision\",\"client_payload\":{\"currencies\":\"${RATE_DEC}\",\"source\":\"ff-calendar\",\"date\":\"${NOW}\"}}")
          if [ "${HTTP_CODE_1}" = "204" ]; then
            echo "Dispatch accepted (204) -- update-rates.yml will start shortly."
          else
            echo "WARNING: dispatch to globalinvesting-scripts returned HTTP ${HTTP_CODE_1} -- check SCRIPTS_PAT scope/expiry."
            cat /tmp/dispatch1.json 2>/dev/null || true
          fi

          echo "Firing repository_dispatch[cb-rate-decision] -> GlobalInvesting/globalinvesting-engine (workflow_meetings.yml)"
          HTTP_CODE_2=$(curl -s -o /tmp/dispatch2.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/GlobalInvesting/globalinvesting-engine/dispatches" \
            -d "{\"event_type\":\"cb-rate-decision\",\"client_payload\":{\"currencies\":\"${RATE_DEC}\",\"source\":\"ff-calendar\",\"date\":\"${NOW}\"}}")
          if [ "${HTTP_CODE_2}" = "204" ]; then
            echo "Dispatch accepted (204) -- workflow_meetings.yml will start shortly."
          else
            echo "WARNING: dispatch to globalinvesting-engine returned HTTP ${HTTP_CODE_2} -- check PAT_TOKEN scope/expiry."
            cat /tmp/dispatch2.json 2>/dev/null || true
          fi

      - name: Persist cb-rate-decision dispatch log (dedup, v8.521.0)
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f /tmp/new_rate_dec_keys.json ]; then
            exit 0
          fi
          NEW_KEYS=$(cat /tmp/new_rate_dec_keys.json)
          if [ "${NEW_KEYS}" = "[]" ]; then
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3; do
            echo "--- Dispatch-log commit attempt $i ---"
            git fetch origin main
            git reset --hard origin/main

            NEW_KEYS_JSON="${NEW_KEYS}" python3 -c "
          import json, os
          log_path = 'calendar-data/cb-rate-dispatch-log.json'
          log = json.load(open(log_path)) if os.path.exists(log_path) else {}
          new_keys = json.loads(os.environ['NEW_KEYS_JSON'])
          now = __import__('datetime').datetime.now(__import__('datetime').timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          for k in new_keys:
              log[k] = now
          json.dump(log, open(log_path, 'w'), indent=2, sort_keys=True)
          "
            git add calendar-data/cb-rate-dispatch-log.json
            if git diff --quiet && git diff --staged --quiet; then
              echo "No changes vs remote HEAD — dedup entry already present (race resolved)."
              exit 0
            fi
            git commit -m "cb-rate-decision dispatch log: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin main; then
              echo "Dispatch log pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "WARNING: could not persist dispatch log after 3 attempts — a duplicate dispatch is possible on the next matching run, not a data-loss risk."
