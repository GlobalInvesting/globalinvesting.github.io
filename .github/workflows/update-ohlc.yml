name: Update OHLC Chart Data — v2.3 (private scripts)


on:
  schedule:
    - cron: '2,32 * * * 1-5'
    - cron: '30 1 * * 2-6'
    - cron: '30 23 * * 0,6'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-ohlc
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update-ohlc:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v6

      - name: Checkout private scripts
        uses: actions/checkout@v6
        with:
          repository: GlobalInvesting/globalinvesting-scripts
          token: ${{ secrets.SCRIPTS_PAT }}
          path: private-scripts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance scipy requests --break-system-packages

      - name: Create output directories
        run: mkdir -p ohlc-data ohlc-data/h1 ohlc-data/h4

      - name: Create ai-analysis directory (D1 finalization run only)
        if: github.event.schedule == '30 1 * * 2-6' || github.event_name == 'workflow_dispatch'
        run: mkdir -p ai-analysis

      - name: Fetch OHLC data
        env:
          SITE_DIR: .
          OHLC_FULL_REFRESH: ${{ github.event.schedule != '2,32 * * * 1-5' }}
        run: python3 private-scripts/fetch_ohlc.py

      - name: Fetch credit spread OHLC — HY/IG OAS (D1 finalization run only)
        if: github.event.schedule == '30 1 * * 2-6' || github.event_name == 'workflow_dispatch'
        env:
          SITE_DIR: .
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 private-scripts/fetch_credit_spreads.py

      - name: Calculate technical levels (D1 finalization run only)
        if: github.event.schedule == '30 1 * * 2-6' || github.event_name == 'workflow_dispatch'
        env:
          SITE_DIR: .
        run: python3 private-scripts/calculate_technical_levels.py

      - name: Create seasonality-data directory (D1 finalization run only)
        if: github.event.schedule == '30 1 * * 2-6' || github.event_name == 'workflow_dispatch'
        run: mkdir -p seasonality-data

      - name: Compute seasonality (D1 finalization run only)
        if: github.event.schedule == '30 1 * * 2-6' || github.event_name == 'workflow_dispatch'
        env:
          SITE_DIR: .
        run: python3 private-scripts/compute_seasonality.py

      - name: Display summary
        if: always()
        run: |
          if [ -f ohlc-data/meta.json ]; then
            echo "════════════════════════════════════════"
            echo "   OHLC UPDATE SUMMARY"
            echo "════════════════════════════════════════"
            python3 -c "
          import json, os
          with open('ohlc-data/meta.json') as f:
              m = json.load(f)
          print(f'  Updated   : {m[\"updated_at\"]}')
          print(f'  D1 symbols: {m[\"symbol_count\"]} written')
          print(f'  Period    : {m[\"period\"]} / {m[\"interval\"]}')
          if m['errors']:
              print(f'  Errors    : {len(m[\"errors\"])} failed: {m[\"errors\"]}')
          else:
              print('  Errors    : none')
          total = 0
          for root, dirs, files in os.walk('ohlc-data'):
              for f in files:
                  if f.endswith('.json') and f != 'meta.json':
                      total += os.path.getsize(os.path.join(root, f))
          h1_count = len([f for f in os.listdir('ohlc-data/h1') if f.endswith('.json')]) if os.path.isdir('ohlc-data/h1') else 0
          h4_count = len([f for f in os.listdir('ohlc-data/h4') if f.endswith('.json')]) if os.path.isdir('ohlc-data/h4') else 0
          print(f'  H1 files  : {h1_count}')
          print(f'  H4 files  : {h4_count}')
          print(f'  Total size: {total // 1024} KB raw')
          "
          fi

      - name: Commit and push
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp -r ohlc-data/ /tmp/ohlc_fresh/
          if [ -f ai-analysis/technical-levels.json ]; then
            mkdir -p /tmp/ai_analysis_fresh
            cp ai-analysis/technical-levels.json /tmp/ai_analysis_fresh/
          fi
          if [ -d seasonality-data ] && [ "$(ls -A seasonality-data 2>/dev/null)" ]; then
            cp -r seasonality-data/ /tmp/seasonality_fresh/
          fi
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/ohlc_fresh/. ohlc-data/
            git add ohlc-data/
            if [ -f /tmp/ai_analysis_fresh/technical-levels.json ]; then
              mkdir -p ai-analysis
              cp /tmp/ai_analysis_fresh/technical-levels.json ai-analysis/
              git add ai-analysis/technical-levels.json
            fi
            if [ -d /tmp/seasonality_fresh ]; then
              mkdir -p seasonality-data
              cp -r /tmp/seasonality_fresh/. seasonality-data/
              git add seasonality-data/
            fi
            if git diff --quiet && git diff --staged --quiet; then
              echo "No changes vs remote HEAD — skipping commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "data: ohlc update [${TIMESTAMP}]"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "⚠️  All push attempts exhausted — data will refresh on next scheduled run."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trigger Pages deploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
