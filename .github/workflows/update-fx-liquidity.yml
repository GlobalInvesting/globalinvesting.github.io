name: Update FX Liquidity Profile — v2.1 (private scripts)

# ESTRATEGIA DE TRIGGER
#
# Corre cada hora en días de semana durante horario de mercado FX:
#   - Domingo 21:00 UTC (Sydney open) → Viernes 21:00 UTC (NY close)
#   - Schedule: cada hora, 7 días (el script ignora fins de semana en el output)
#
# Adicionalmente: workflow_dispatch para test manual.
#
# DURACIÓN ESTIMADA: ~45 seg (5 pares × 35d × 1h = ~840 filas por par, fetch en batch)
# Sin riesgo de solapamiento a 1h de intervalo.
#
# PLACEMENT: script fetch_fx_liquidity.py vive en el repo privado globalinvesting-scripts
# (checkout explícito vía SCRIPTS_PAT). Los minutos de Actions se consumen en este
# repo público → ilimitados y sin costo.
#
# TRIGGER STRATEGY: dispatch de un reloj externo (primario) + GH schedule fallback.
# GitHub's native cron puede saltear ejecuciones bajo carga del sistema — el reloj
# externo actúa como respaldo confiable, disparando cada hora en punto vía
# repository_dispatch. Detalle de setup y proveedor en el runbook privado del
# repo engine, no acá — ver GUIDELINES.md "Public workflow files must not name
# data/infra vendors".

on:
  repository_dispatch:
    types: [trigger-fx-liquidity]   # ← dispatched by the external clock, hourly

  schedule:
    # Fallback — cada hora, todos los días. El script maneja fins de semana internamente
    # (si no hay datos intraday, el fallback LIQ_BASE se activa automáticamente)
    - cron: '0 * * * *'

  workflow_dispatch:   # trigger manual desde GitHub UI para test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 20 → 24 opt-in (mandatory before June 2 2026)

concurrency:
  group: update-fx-liquidity
  cancel-in-progress: false   # no cancelar un fetch en curso — esperar

permissions:
  contents: write   # necesario para git push al mismo repo
  actions: write    # necesario para disparar deploy-pages.yml (ver step "Trigger Pages deploy")

jobs:
  fetch-fx-liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v6

      - name: Checkout private scripts
        uses: actions/checkout@v6
        with:
          repository: GlobalInvesting/globalinvesting-scripts
          token: ${{ secrets.SCRIPTS_PAT }}
          path: private-scripts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance --break-system-packages

      - name: Create output directory
        run: mkdir -p fx-data

      - name: Fetch FX liquidity profile
        env:
          SITE_PATH: .
        run: python3 private-scripts/fetch_fx_liquidity.py

      - name: Display summary
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "       FX LIQUIDITY PROFILE SUMMARY"
          echo "========================================"
          if [ -f "fx-data/fx-liquidity.json" ]; then
            python3 -c "
          import json
          with open('fx-data/fx-liquidity.json') as f:
              d = json.load(f)
          print(f'  Updated:        {d[\"updated\"]}')
          print(f'  Source:         {d[\"source\"]}')
          print(f'  Fallback:       {d[\"fallback\"]}')
          print(f'  Hours complete: {d[\"hours_complete\"]}')
          b = d['baseline_30d']
          peak_h = b.index(max(b))
          print(f'  Baseline peak:  {peak_h:02d}:00 UTC  (val={max(b)})')
          today = d['today']
          real = [(i, v) for i, v in enumerate(today) if v > 0]
          print(f'  Today real hrs: {len(real)} ({[f\"{h}:00\" for h,v in real[:3]]}...)')
          "
          else
            echo "  fx-data/fx-liquidity.json NOT created"
          fi

      - name: Commit and push
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp fx-data/fx-liquidity.json /tmp/fx_liquidity_fresh.json
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fx_liquidity_fresh.json fx-data/fx-liquidity.json
            git add fx-data/fx-liquidity.json
            if git diff --staged --quiet; then
              echo "No changes vs remote HEAD — skipping commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "FX liquidity profile ${TIMESTAMP}"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "⚠️  All push attempts exhausted — data will refresh on next scheduled run."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trigger Pages deploy
        # Pushes made with the default GITHUB_TOKEN do NOT trigger other on:push
        # workflows (GitHub's loop-prevention rule) — dispatch deploy-pages.yml
        # explicitly, only when this run actually pushed new data.
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
