name: Fetch Forex News
on:
  repository_dispatch:
    types: [trigger-forex-news]

  schedule:
    - cron: '0,10,20,30,40,50 * * * *'
    - cron: '5 * * * *'

  workflow_dispatch:
    inputs:
      news_mode:
        description: 'NEWS_MODE override: fast (primary sources only) or full (all configured sources)'
        required: false
        default: 'full'


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: forex-news
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v6

      - name: Checkout private scripts
        uses: actions/checkout@v6
        with:
          repository: GlobalInvesting/globalinvesting-scripts
          token: ${{ secrets.SCRIPTS_PAT }}
          path: private-scripts


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser==6.0.11 requests==2.32.3 python-dateutil==2.9.0.post0 --break-system-packages

      - name: Create output directory
        run: mkdir -p news-data

      - name: Set NEWS_MODE
        id: news_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.news_mode }}"
            MODE="${MODE:-full}"
          else
            MINUTE=$(date -u +%M)
            if [ "$MINUTE" = "05" ]; then
              MODE="full"
            else
              MODE="fast"
            fi
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "NEWS_MODE=$MODE"

      - name: Fetch news from RSS feeds
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_MODE: ${{ steps.news_mode.outputs.mode }}
        run: python3 private-scripts/fetch_news.py

      - name: Commit updated news data
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp news-data/news.json /tmp/news_fresh.json
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/news_fresh.json news-data/news.json
            git add news-data/news.json
            if git diff --staged --quiet; then
              echo "Sin cambios vs remote HEAD — skipping commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: fetch news [${TIMESTAMP}]"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rechazado (intento $i) — reintentando en $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "⚠️  All push attempts exhausted — data will refresh on next scheduled run."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trigger Pages deploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
