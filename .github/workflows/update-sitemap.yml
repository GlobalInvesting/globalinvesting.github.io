name: Update Sitemap


on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'ai-analysis/**'
      - 'cot-data/**'
      - 'rates/**'
      - 'ois-rates/**'
      - 'economic-data/**'
      - 'sentiment-data/**'
      - 'scripts/update_sitemap.py'
      - '.github/workflows/update-sitemap.yml'

  repository_dispatch:
    types: [trigger-sitemap]

  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

concurrency:
  group: update-sitemap
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo (full history for git log dates)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Regenerate sitemap.xml
        run: python3 scripts/update_sitemap.py

      - name: Commit and push (if changed)
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            git fetch origin main
            git reset --hard origin/main

            python3 scripts/update_sitemap.py

            git add sitemap.xml
            if git diff --quiet && git diff --staged --quiet; then
              echo "sitemap.xml unchanged — skipping commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "sitemap: update lastmod dates ${TIMESTAMP}"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "⚠️  All push attempts exhausted — sitemap will update on next run."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trigger Pages deploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
