name: Update Sitemap

# Regenerates sitemap.xml with accurate lastmod dates derived from git history.
# Runs automatically on every push to main that touches an HTML page, key data
# files, or this workflow/script itself.
#
# Why: previously all lastmod values were hardcoded to the same date.
# Google uses lastmod to prioritise re-crawl scheduling — stale or uniform
# dates reduce crawl efficiency and delay ranking updates after content changes.
#
# Approach: scripts/update_sitemap.py calls `git log -1 --format=%cI <file>`
# for each page and its data dependencies, picks the most recent commit date,
# and writes a fresh sitemap.xml. For the terminal (index.html), AI narrative
# JSON is included as a dependency so daily AI updates also bump the lastmod.
#
# No secrets required — reads only public git history.
# Schedule: also runs weekly (Sunday 01:00 UTC) as a safety net.
#
# TRIGGER STRATEGY: the push trigger above already fires this workflow constantly
# (every data-pipeline commit that touches the watched paths), so the weekly cron
# is a rarely-exercised last resort. Since it's a single weekly shot with no buffer,
# a GitHub cron skip means a full week of stale lastmod dates. An external clock
# service adds a reliable backup dispatch for that same weekly slot — setup detail
# and provider name kept in the private engine repo's ops runbook, not here — see
# GUIDELINES.md "Public workflow files must not name data/infra vendors".

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'ai-analysis/**'
      - 'cot-data/**'
      - 'rates/**'
      - 'ois-rates/**'
      - 'economic-data/**'
      - 'sentiment-data/**'
      - 'scripts/update_sitemap.py'
      - '.github/workflows/update-sitemap.yml'

  repository_dispatch:
    types: [trigger-sitemap]   # ← dispatched by the external clock, weekly (Sunday 01:00 UTC)

  schedule:
    - cron: '0 1 * * 0'   # Fallback — Sunday 01:00 UTC weekly safety run
  workflow_dispatch:

concurrency:
  group: update-sitemap
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # necesario para disparar deploy-pages.yml (ver step "Trigger Pages deploy")

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo (full history for git log dates)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history required — git log -1 needs commit ancestry

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Regenerate sitemap.xml
        run: python3 scripts/update_sitemap.py

      - name: Commit and push (if changed)
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            git fetch origin main
            git reset --hard origin/main

            # Re-run against fresh checkout to avoid stale working tree
            python3 scripts/update_sitemap.py

            git add sitemap.xml
            if git diff --quiet && git diff --staged --quiet; then
              echo "sitemap.xml unchanged — skipping commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "sitemap: update lastmod dates ${TIMESTAMP}"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "⚠️  All push attempts exhausted — sitemap will update on next run."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trigger Pages deploy
        # Pushes made with the default GITHUB_TOKEN do NOT trigger other on:push
        # workflows (GitHub's loop-prevention rule) — dispatch deploy-pages.yml
        # explicitly, only when this run actually pushed new data.
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
