name: Generate AI Narrative & Market Signals




on:
  repository_dispatch:
    types: [trigger-ai-narrative]
  schedule:
    - cron: '0  0  * * *'
    - cron: '55 6  * * *'
    - cron: '55 11 * * *'
    - cron: '55 20 * * *'
    - cron: '25 22 * * 5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

concurrency:
  group: generate-ai-narrative
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout THIS public site repo
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout private engine repo (scripts)
        uses: actions/checkout@v6
        with:
          repository: GlobalInvesting/globalinvesting-engine
          token: ${{ secrets.PAT_TOKEN }}
          path: engine

      - name: Idempotency guard — skip if a sibling trigger already ran this cycle
        id: guard
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "site/ai-analysis/index.json" ]; then
            GENERATED_AT=$(python3 -c "import json; d=json.load(open('site/ai-analysis/index.json')); print(d.get('generated_at',''))" 2>/dev/null || echo "")
            if [ -n "$GENERATED_AT" ]; then
              AGE_MIN=$(python3 -c "
          from datetime import datetime, timezone
          ts = '$GENERATED_AT'.replace('Z', '+00:00')
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(ts)).total_seconds() / 60
          print(int(age))
          " 2>/dev/null || echo 9999)
              if [ "$AGE_MIN" -lt 20 ] 2>/dev/null; then
                echo "site/ai-analysis/index.json was generated ${AGE_MIN} min ago (< 20 min) — a sibling trigger already completed this cycle. Skipping the rest of this run."
                SKIP=true
              fi
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests --break-system-packages

      - name: Create output directories
        if: steps.guard.outputs.skip != 'true'
        run: mkdir -p site/ai-analysis

      - name: Generate narrative and signals
        if: steps.guard.outputs.skip != 'true'
        working-directory: site
        env:
          AI_FALLBACK_KEY:   ${{ secrets.AI_FALLBACK_KEY }}
          AI_FALLBACK_KEY_2: ${{ secrets.AI_FALLBACK_KEY_2 }}
          AI_FALLBACK_KEY_3: ${{ secrets.AI_FALLBACK_KEY_3 }}
          AI_FALLBACK_KEY_4: ${{ secrets.AI_FALLBACK_KEY_4 }}
          AI_FALLBACK_KEY_6: ${{ secrets.AI_FALLBACK_KEY_6 }}
          AI_PRIMARY_KEY:   ${{ secrets.AI_PRIMARY_KEY }}
          AI_PRIMARY_KEY_2: ${{ secrets.AI_PRIMARY_KEY_2 }}
          AI_PRIMARY_KEY_5: ${{ secrets.AI_PRIMARY_KEY_5 }}
          WEB_SEARCH_KEY: ${{ secrets.WEB_SEARCH_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — forcing regeneration (--force)"
            python ../engine/scripts/generate_narrative_signals.py --mode intraday --force
          else
            NARRATIVE_AGE_H=0
            if [ -f "ai-analysis/index.json" ]; then
              GENERATED_AT=$(python3 -c "import json; d=json.load(open('ai-analysis/index.json')); print(d.get('generated_at',''))" 2>/dev/null || echo "")
              if [ -n "$GENERATED_AT" ]; then
                NARRATIVE_AGE_H=$(python3 -c "import sys; from datetime import datetime, timezone; ts='$GENERATED_AT'.replace('Z','+00:00'); age=(datetime.now(timezone.utc)-datetime.fromisoformat(ts)).total_seconds()/3600 if ts else 0; print(int(age))" 2>/dev/null || echo 0)
              fi
            fi
            if [ "$NARRATIVE_AGE_H" -ge 20 ] 2>/dev/null; then
              echo "Narrative is ${NARRATIVE_AGE_H}h old — forcing regeneration (FIX-23)"
              python ../engine/scripts/generate_narrative_signals.py --mode intraday --force
            else
              python ../engine/scripts/generate_narrative_signals.py --mode intraday
            fi
          fi

      - name: Display output summary
        if: always()
        working-directory: site
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "   NARRATIVE & SIGNALS SUMMARY"
          echo "════════════════════════════════════════"
          if [ -f "ai-analysis/index.json" ]; then
            python3 -c "
          import json
          with open('ai-analysis/index.json') as f:
              d = json.load(f)
          print(f'  Regime    : {d.get(\"regime\", \"N/A\")}')
          print(f'  Narrative : {d.get(\"narrative\", \"\")[:120]}...')
          print(f'  Generated : {d.get(\"generated_at\", \"N/A\")}')
          "
          fi
          if [ -f "ai-analysis/signals.json" ]; then
            python3 -c "
          import json
          with open('ai-analysis/signals.json') as f:
              data = json.load(f)
          signals = data.get('signals', data) if isinstance(data, dict) else data
          print(f'  Signals   : {len(signals)} alerts generated')
          for s in signals:
              print(f'    [{s.get(\"priority\",\"info\").upper()[:4]}] {s.get(\"title\",\"\")} — {s.get(\"text\",\"\")[:80]}')
          "
          fi

      - name: Commit and push
        if: steps.guard.outputs.skip != 'true'
        working-directory: site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/ai_analysis_fresh
          cp ai-analysis/index.json ai-analysis/signals.json ai-analysis/context_snapshot.json \
             /tmp/ai_analysis_fresh/
          [ -f ai-analysis/currency-drivers.json ] && cp ai-analysis/currency-drivers.json /tmp/ai_analysis_fresh/
          [ -f ai-analysis/session-context.json  ] && cp ai-analysis/session-context.json  /tmp/ai_analysis_fresh/
          [ -f ai-analysis/call-budget-state.json ] && cp ai-analysis/call-budget-state.json /tmp/ai_analysis_fresh/
          [ -f feed.xml  ] && cp feed.xml  /tmp/ai_analysis_fresh/
          [ -f feed.json ] && cp feed.json /tmp/ai_analysis_fresh/
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ai_analysis_fresh/index.json \
               /tmp/ai_analysis_fresh/signals.json \
               /tmp/ai_analysis_fresh/context_snapshot.json \
               ai-analysis/
            [ -f /tmp/ai_analysis_fresh/currency-drivers.json ] && cp /tmp/ai_analysis_fresh/currency-drivers.json ai-analysis/
            [ -f /tmp/ai_analysis_fresh/session-context.json  ] && cp /tmp/ai_analysis_fresh/session-context.json  ai-analysis/
            [ -f /tmp/ai_analysis_fresh/call-budget-state.json ] && cp /tmp/ai_analysis_fresh/call-budget-state.json ai-analysis/
            [ -f /tmp/ai_analysis_fresh/feed.xml  ] && cp /tmp/ai_analysis_fresh/feed.xml  .
            [ -f /tmp/ai_analysis_fresh/feed.json ] && cp /tmp/ai_analysis_fresh/feed.json .
            git add ai-analysis/index.json ai-analysis/signals.json ai-analysis/session-context.json ai-analysis/context_snapshot.json
            git add ai-analysis/currency-drivers.json ai-analysis/session-context.json 2>/dev/null || true
            git add ai-analysis/call-budget-state.json 2>/dev/null || true
            git add feed.xml feed.json 2>/dev/null || true
            if git diff --quiet && git diff --staged --quiet; then
              echo "No changes vs remote HEAD — skipping commit."
              exit 0
            fi
            git commit -m "ai: narrative + signals [${TIMESTAMP}]"
            if git push origin main; then
              echo "✅ Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — retrying in $((i * 2))s..."
            sleep $((i * 2))
          done
          echo "⚠️  All push attempts exhausted — narrative will publish on next scheduled run."
          exit 0
