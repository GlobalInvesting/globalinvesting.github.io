name: 🔬 Diagnose Myfxbook Login (manual, no production impact)

# Manual-only diagnostic. Does NOT write sentiment-data/myfxbook.json or
# ops-state/myfxbook-session.json, does NOT run on a schedule, and is not
# part of the regular sentiment pipeline. See diagnose_myfxbook_login.py's
# module docstring in the private scripts repo for the full rationale:
# this exists to determine, with live evidence, whether a real headless
# browser (Playwright/Chromium -- already proven reachable from this CI
# environment by update-saxo-rr.yml) clears the account-level block that
# fetch_myfxbook_sentiment.py's pure-API login cannot, and — if not —
# what the actual blocking mechanism is (rate/pattern-based vs. an
# interactive human-verification challenge).

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout private scripts
        uses: actions/checkout@v6
        with:
          repository: GlobalInvesting/globalinvesting-scripts
          token: ${{ secrets.SCRIPTS_PAT }}
          path: private-scripts

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run login diagnostic
        env:
          MYFXBOOK_EMAIL:    ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
          SCREENSHOT_DIR:    diagnostic-output
        working-directory: private-scripts
        run: python3 diagnose_myfxbook_login.py

      - name: Upload pre-submit screenshot (diagnostic only)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: myfxbook-login-diagnostic
          path: private-scripts/diagnostic-output/
          retention-days: 7
          if-no-files-found: ignore
